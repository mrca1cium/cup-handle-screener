name: Daily Cup & Handle Scan

on:
  schedule:
    - cron: "30 21 * * 1-5"  # 美東收市後 30 分鐘（UTC 21:30，香港朝早 5:30，夏令）；冬日時間請改 22:30
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests pandas lxml
      - name: Run screener
        # --universe sp1500：S&P500+400+600（約1400-1500隻）取代舊時得500隻
        # 落歷史K線前，會先用批量報價（v7/quote）剔除股價<$10或日均量<50萬嘅垃圾股，
        # 大減要落嘅歷史請求數量，避免畀 Yahoo Finance 限流／封鎖 GitHub Actions IP
        run: python screener/main.py --pause 0.35 --universe sp1500
      - name: Commit results
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@github.com"
          git add docs/data/
          git diff --cached --quiet || git commit -m "scan: $(date -u +%F) results"
          git push
