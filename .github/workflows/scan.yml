name: Daily Cup & Handle Scan

on:
  schedule:
    - cron: "30 21 * * 1-5"  # 美東收市後 30 分鐘（UTC 21:30，香港朝早 5:30，夏令）；冬日時間請改 22:30
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests pandas lxml
      - name: Run screener
        # --universe broad：sp1500（有 GICS 板塊）+ SEC 全市場長尾（冇板塊，但用
        # --min-market-cap 同 --min-avg-vol 嚴格把關，唔會落未經驗證嘅細價股歷史數據）
        # --max-universe 1500：篩後最終落歷史 K 線嘅隻數上限，核心池優先保留
        run: python screener/main.py --pause 0.35 --universe broad --min-market-cap 2000000000 --max-universe 1500
      - name: Commit results
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@github.com"
          git add docs/data/
          git diff --cached --quiet || git commit -m "scan: $(date -u +%F) results"
          git push
